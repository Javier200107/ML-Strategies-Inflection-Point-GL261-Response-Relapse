setting:
  binWidth: 1  # Optimal bin width for MRI intensities; helps normalize intensity ranges
  resampledPixelSpacing: [0.2, 0.2]  # Adjust this to match voxel spacing in your dataset
  interpolator: 'sitkBSpline'  # Ensures smooth interpolation
  normalize: true  # Ensures intensity standardization
  removeOutliers: 3
  preCrop: true
  padDistance: 5

imageType:
  Original: {}
  Wavelet: {}
  LoG: {'sigma': [1.0, 2.0, 3.0]}
  Square: {}
  SquareRoot: {}
  Logarithm: {}
  Exponential: {}
  Gradient: {}

featureClass:
  firstorder: 
  glcm: 
  glrlm: 
  glszm: 
  gldm: 
  ngtdm: 
