[project]
name = "gl261-response-relapse"
version = "0.1.0"
description = "ML strategies for predicting therapy response in preclinical GL261 glioblastoma from longitudinal T2w MRI"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "xgboost>=1.7,<3.0",
    "scikit-learn>=1.3,<2.0",
    "imbalanced-learn>=0.11,<1.0",

    "numpy>=1.23,<2.0",
    "pandas>=1.5,<3.0",
    "scipy>=1.10,<2.0",

    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",

    "opencv-python>=4.7,<5.0",
    "Pillow>=9.0",

    "pyradiomics==3.0.1",
    "SimpleITK>=2.2",

    "jupyter>=1.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",

    "tqdm>=4.0",
    "joblib>=1.2",
]

[project.optional-dependencies]
gpu = [
    "tensorflow==2.10.0",
]

cpu = [
    "tensorflow-cpu==2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.extra-build-dependencies]
pyradiomics = ["numpy"]

[dependency-groups]
dev = [
    "nbformat>=5.9",
    "nbconvert>=7.0",
]