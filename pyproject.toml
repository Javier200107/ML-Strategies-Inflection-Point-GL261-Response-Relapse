[project]
name = "gl261-response-relapse"
version = "0.1.0"
description = "ML strategies for predicting therapy response in preclinical GL261 glioblastoma from longitudinal T2w MRI"
readme = "README.md"
# TF 2.10 supports 3.7-3.10. The experiments were run on Python 3.10 (conda tfm_new).
# For development/analysis without GPU inference, Python 3.11+ works for all non-TF code.
requires-python = ">=3.10"

dependencies = [
    # Core ML
    "xgboost>=1.7,<3.0",
    "scikit-learn>=1.3,<2.0",
    "imbalanced-learn>=0.11,<1.0",
    # Data
    "numpy>=1.23,<2.0",
    "pandas>=1.5,<3.0",
    "scipy>=1.10,<2.0",
    # Visualisation
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",
    # Image processing
    "opencv-python>=4.7,<5.0",
    "Pillow>=9.0",
    # Radiomics
    "pyradiomics>=3.0",
    "SimpleITK>=2.2",
    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    # Utilities
    "tqdm>=4.0",
    "joblib>=1.2",
]

[project.optional-dependencies]
# TensorFlow GPU (Windows + CUDA 11.x) — used for the DL experiments
# Install with: uv pip install tensorflow==2.10.0
gpu = [
    "tensorflow==2.10.0",
]
# TensorFlow CPU — for code review / analysis without GPU
cpu = [
    "tensorflow-cpu>=2.10,<2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "nbformat>=5.9",
    "nbconvert>=7.0",
]
